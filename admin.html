<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="images/favicon-512.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="robots" content="noindex, nofollow">
<title>예약 관리 | 스펙트럼 채정호 정신건강의학과의원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Hahmlet:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

<!-- Sign in -->
<div id="login-view" class="center" hidden>
  <div class="reserve-card admin-login">
    <img src="images/clinic-logo.svg" alt="스펙트럼 채정호 정신건강의학과의원" class="admin-login__logo" width="2015" height="553">
    <h1>직원 로그인</h1>
    <form id="login-form" novalidate>
      <div class="form-error" id="login-error" role="alert"></div>
      <div class="field">
        <label for="email">이메일</label>
        <input type="text" id="email" inputmode="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--primary reserve-submit" id="login-submit">로그인</button>
    </form>
  </div>
</div>

<!-- Signed in but not on the staff list -->
<div id="denied-view" class="center" hidden>
  <div class="reserve-card" style="text-align: center;">
    <h2>접근 권한이 없습니다</h2>
    <p>이 계정은 직원으로 등록되어 있지 않습니다. 관리자에게 등록을 요청해 주세요.</p>
  </div>
</div>

<!-- App -->
<div id="app" hidden>
  <header class="bar">
    <a class="bar__brand" href="admin.html" aria-label="예약 관리">
      <img src="images/favicon-512.png" alt="" width="30" height="30">
      <span>예약 관리</span>
    </a>
    <nav class="bar__tabs" aria-label="메뉴">
      <button type="button" data-tab="bookings" class="is-active">예약 목록</button>
      <button type="button" data-tab="closed">휴진일</button>
    </nav>
    <div class="bar__user" id="admin-user" hidden>
      <span id="admin-email"></span>
      <button type="button" class="btn-line" id="logout">로그아웃</button>
    </div>
  </header>

  <main class="wrap">

    <!-- Bookings -->
    <div id="tab-bookings">
      <div class="tools">
        <label class="search">
          <input type="search" id="search" placeholder="이름, 연락처, 이메일, 메모 검색" autocomplete="off">
        </label>
        <div class="tools__actions">
          <button type="button" class="btn-line" id="copy-all" title="화면에 보이는 예약을 표 형태로 복사 (엑셀, CRM에 붙여넣기)">목록 복사</button>
          <button type="button" class="btn-line" id="export">엑셀 다운로드</button>
          <button type="button" class="btn-line" id="refresh">새로고침</button>
        </div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="상태">
        <button type="button" data-s="new" class="is-active">새 요청 <b></b></button>
        <button type="button" data-s="contacted">연락함 <b></b></button>
        <button type="button" data-s="confirmed">확정 <b></b></button>
        <button type="button" data-s="cancelled">취소 <b></b></button>
        <button type="button" data-s="all">전체 <b></b></button>
      </div>
      <p class="hint">각 예약의 <b>복사</b> 버튼을 누르면 이름, 연락처, 희망 일시 등이 글로 복사됩니다. CRM에 그대로 붙여넣을 수 있습니다.</p>
      <div class="form-error" id="list-error" role="alert"></div>
      <div id="list"></div>
    </div>

    <!-- Closed days -->
    <div id="tab-closed" hidden>
      <h1 class="page-title">휴진일</h1>
      <p class="hint">휴진으로 지정한 날은 환자 예약 화면에서 선택할 수 없습니다. 2027년 공휴일은 미리 지정되어 있습니다.</p>
      <form class="closed-form" id="closed-form" novalidate>
        <div class="form-error" id="closed-error" role="alert"></div>
        <div class="closed-form__row">
          <label>시작일<input type="date" id="c-from"></label>
          <label>종료일<input type="date" id="c-to"></label>
          <label class="grow">사유 (선택)<input type="text" id="c-reason" maxlength="100" placeholder="예: 학회 참석" autocomplete="off"></label>
          <button type="submit" class="btn-main" id="c-add">휴진 지정</button>
        </div>
        <p class="closed-form__sum" id="c-sum"></p>
      </form>
      <div id="closed-list"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script src="js/admin.js"></script>
</body>
</html>
